name: Android debug build
on:
  workflow_dispatch:
  push:
    branches: [ main, phase-1-engine, feature/elizawa-status-vault ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Node.js for WebView syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check embedded WebView JavaScript
        run: python3 scripts/check_web.py
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DCPI-Audio-Stickers-debug
          path: app/build/outputs/apk/debug/app-debug.apk
